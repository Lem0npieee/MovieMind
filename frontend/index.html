<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMind - 豆瓣 Top 250 电影智能检索</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🎬 MovieMind</h1>
                <p class="tagline">发现经典 · 智能推荐</p>
            </div>
            <div class="nav-right">
                <div class="nav-menu">
                    <a href="#" class="nav-link active" data-page="home">首页</a>
                    <a href="#" class="nav-link" data-page="recommend">AI智能推荐</a>
                    <a href="#" class="nav-link" data-page="search">自然语言查询</a>
                    <a href="#" class="nav-link" data-page="stats">数据可视化看板</a>
                </div>
                <div class="account-wrapper">
                    <button id="account-display" class="account-chip" aria-label="账户入口">
                        <span id="account-name">点击登录</span>
                        <span class="account-caret">▾</span>
                    </button>
                    <div id="account-dropdown" class="account-dropdown" aria-label="账户菜单">
                        <button class="dropdown-item" id="account-home">个人主页</button>
                        <button class="dropdown-item" id="account-logout">退出登录</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="theme-toggle" data-tooltip="切换主题" aria-label="切换明亮/迷影模式">
        <span class="icon">🌓</span>
    </button>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 首页 - 电影榜单 -->
        <section id="page-home" class="page-section active">
            <div class="container">
                <!-- 筛选栏 -->
                <div class="filter-bar">
                    <div class="filter-group">
                        <label>类型:</label>
                        <select id="filter-genre">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>国家/地区:</label>
                        <select id="filter-country">
                            <option value="">全部</option>
                            <option value="美国">美国</option>
                            <option value="英国">英国</option>
                            <option value="日本">日本</option>
                            <option value="中国香港">中国香港</option>
                            <option value="中国大陆">中国大陆</option>
                            <option value="法国">法国</option>
                            <option value="德国">德国</option>
                            <option value="韩国">韩国</option>
                            <option value="意大利">意大利</option>
                            <option value="加拿大">加拿大</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>年代:</label>
                        <select id="filter-year">
                            <option value="">全部</option>
                            <option value="1900-1949">1950年前</option>
                            <option value="1950-1959">1950s</option>
                            <option value="1960-1969">1960s</option>
                            <option value="1970-1979">1970s</option>
                            <option value="1980-1989">1980s</option>
                            <option value="1990-1999">1990s</option>
                            <option value="2000-2009">2000s</option>
                            <option value="2010-2019">2010s</option>
                            <option value="2020-2029">2020s</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>评分:</label>
                        <select id="filter-rating">
                            <option value="">全部</option>
                            <option value="8.4-8.7">8.4-8.7分</option>
                            <option value="8.8-9.1">8.8-9.1分</option>
                            <option value="9.2-9.4">9.2-9.4分</option>
                            <option value="9.5-9.7">9.5-9.7分</option>
                        </select>
                    </div>
                    <button id="btn-filter" class="btn btn-primary">筛选</button>
                    <button id="btn-reset" class="btn btn-secondary">重置</button>
                </div>

                <!-- 搜索栏 -->
                <div class="search-bar">
                    <input type="text" id="keyword-search" placeholder="搜索电影、导演、演员...">
                    <button id="btn-keyword-search" class="btn btn-primary">搜索</button>
                </div>

                <!-- 电影网格 -->
                <div id="movies-grid" class="movies-grid">
                    <!-- 动态加载电影卡片 -->
                </div>

                <!-- 分页 -->
                <div id="pagination" class="pagination">
                    <!-- 动态加载分页按钮 -->
                </div>

                <!-- 加载动画 -->
                <div id="loading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
            </div>
        </section>

        <!-- AI智能推荐页 -->
        <section id="page-recommend" class="page-section">
            <div class="container">
                <div class="ai-search-container">
                    <h2>🤖 AI 智能推荐助手</h2>
                    <p class="subtitle">描述你的心情、场景或观影需求，AI 将基于内容理解为你推荐最适合的电影</p>
                    
                    <div class="ai-input-area">
                        <textarea id="recommend-query" placeholder="例如：我今天失恋了，想看一些治愈的电影&#10;或者：我和朋友在路上旅行，推荐适合在路上看的电影&#10;或者：最近工作压力很大，需要一些励志的电影"></textarea>
                        <button id="btn-recommend" class="btn btn-primary btn-large">获取推荐</button>
                    </div>

                    <!-- 示例查询 -->
                    <div class="example-queries">
                        <p>推荐示例:</p>
                        <button class="example-btn-recommend">我失恋了，想看治愈的电影</button>
                        <button class="example-btn-recommend">适合深夜一个人看的电影</button>
                        <button class="example-btn-recommend">和家人一起看的温馨电影</button>
                        <button class="example-btn-recommend">最近很焦虑，需要放松心情</button>
                    </div>

                    <!-- 推荐结果区域 -->
                    <div id="recommend-result" class="ai-result" style="display: none;">
                        <h3>推荐结果</h3>
                        <div id="recommend-interpretation" class="ai-interpretation"></div>
                        <div id="recommend-movies" class="movies-grid"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 自然语言查询页 -->
        <section id="page-search" class="page-section">
            <div class="container">
                <div class="ai-search-container">
                    <h2>💬 自然语言查询助手</h2>
                    <p class="subtitle">用自然语言描述查询条件，AI 将其转换为 SQL 语句并执行查询</p>
                    
                    <div class="ai-input-area">
                        <textarea id="ai-query" placeholder="例如：查找2019年以后上映的评分9分以上的科幻电影&#10;或者：我要看90年代的犯罪类型电影，导演是昆汀·塔伦蒂诺的&#10;或者：评分8.5以上的日本动画电影有哪些？"></textarea>
                        <button id="btn-ai-search" class="btn btn-primary btn-large">执行查询</button>
                    </div>

                    <!-- 示例查询 -->
                    <div class="example-queries">
                        <p>查询示例:</p>
                        <button class="example-btn">2010年后评分9分以上的电影</button>
                        <button class="example-btn">克里斯托弗·诺兰导演的科幻电影</button>
                        <button class="example-btn">评分最高的十部动画电影</button>
                        <button class="example-btn">阿凡达的导演的所有作品</button>
                    </div>

                    <!-- 查询结果区域 -->
                    <div id="ai-result" class="ai-result" style="display: none;">
                        <h3>查询结果</h3>
                        <div id="ai-interpretation" class="ai-interpretation"></div>
                        <div id="ai-movies" class="movies-grid"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 数据可视化页 -->
        <section id="page-stats" class="page-section">
            <div class="container">
                <h2>📊 Top 250 数据洞察</h2>
                <div class="charts-container">
                    <div class="chart-box">
                        <h3>年代分布</h3>
                        <canvas id="chart-year"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>类型分布</h3>
                        <canvas id="chart-genre"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>评分分布</h3>
                        <canvas id="chart-rating"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>国家/地区分布</h3>
                        <canvas id="chart-country"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>导演作品排行 Top 10</h3>
                        <canvas id="chart-director"></canvas>
                    </div>
                    <div class="chart-box">
                        <h3>演员出镜排行 Top 10</h3>
                        <canvas id="chart-actor"></canvas>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 电影详情模态框 -->
    <div id="movie-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="movie-detail">
                <!-- 动态加载电影详情 -->
            </div>
        </div>
    </div>

    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <!-- 主 JS 文件 -->
    <script src="js/app.js"></script>
</body>
</html>
