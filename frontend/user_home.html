<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页 - MovieMind</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a, #0b1224);
            color: #e8ecf5;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1f2a44;
            border-radius: 16px;
            padding: 32px;
            width: min(520px, 94vw);
            box-shadow: 0 16px 60px rgba(0,0,0,0.55);
        }
        h1 { margin-bottom: 8px; }
        p { color: #9aa4b5; }
        .btn {
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: #00d4aa;
            color: #0b1224;
            font-weight: 700;
            cursor: pointer;
        }
        .btn:hover { box-shadow: 0 10px 30px rgba(0,212,170,0.35); }
    </style>
</head>
<body>
    <div class="card">
        <h1>用户主页</h1>
        <p>这里将展示你的收藏、评论、偏好等个性化内容。功能即将上线。</p>
        <button class="btn" onclick="window.location.href='index.html'">返回首页</button>
    </div>
</body>
</html>
