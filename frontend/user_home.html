<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - MovieMind</title>
    <link rel="stylesheet" href="css/user_home.css">
</head>
<body>
    <header class="header-bar">
        <div class="brand-inline">🎬 MovieMind</div>
        <div class="account-wrapper">
            <button id="account-display" class="account-chip" aria-label="账户入口">
                <span id="account-name">点击登录</span>
                <span class="account-caret">▾</span>
            </button>
            <div id="account-dropdown" class="account-dropdown" aria-label="账户菜单">
                <button class="dropdown-item" id="account-home">个人主页</button>
                <button class="dropdown-item" id="account-logout">退出登录</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <section class="hero-card">
            <div>
                <div class="user-name">
                    <span id="uh-username">—</span>
                </div>
                <p id="uh-signature" class="item-sub">最近收藏与评价概览</p>
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-label">收藏电影</div>
                        <div class="stat-value" id="uh-fav-count">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">发表评论</div>
                        <div class="stat-value" id="uh-review-count">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">最近活跃</div>
                        <div class="stat-value" id="uh-last-active">—</div>
                    </div>
                </div>
            </div>
        </section>

        <section class="section" id="fav-section">
            <div class="section-header">
                <div class="section-title">📌 收藏电影</div>
                <button class="btn-link view-all" id="view-all-fav">查看全部收藏</button>
            </div>
            <div class="card-list" id="fav-list"></div>
            <div class="empty" id="fav-empty" style="display:none;">暂无收藏，去电影详情页点“收藏”试试</div>
        </section>

        <section class="section" id="review-section">
            <div class="section-header">
                <div class="section-title">📝 历史评价</div>
                <button class="btn-link view-all" id="view-all-review">查看全部评价</button>
            </div>
            <div class="card-list" id="review-list"></div>
            <div class="empty" id="review-empty" style="display:none;">暂无评价，发表你的第一条观后感吧</div>
        </section>
    </main>

    <script src="js/user_home.js"></script>
</body>
</html>
